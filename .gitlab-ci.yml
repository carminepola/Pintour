stages:
  - build
  - deploy

 
build-web:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  before_script:
    - echo $DOCKER_REGISTRY_PASSWORD | docker login -u $DOCKER_REGISTRY_USER --password-stdin $DOCKER_REGISTRY
  script:
    - docker build -t $DOCKER_REGISTRY/$WEB_IMAGE:$CI_COMMIT_SHA -t $DOCKER_REGISTRY/$WEB_IMAGE:latest .
    - docker push $DOCKER_REGISTRY/$WEB_IMAGE:$CI_COMMIT_SHA
    - docker push $DOCKER_REGISTRY/$WEB_IMAGE:latest
  only:
    - main

build-api:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  before_script:
    - echo $DOCKER_REGISTRY_PASSWORD | docker login -u $DOCKER_REGISTRY_USER --password-stdin $DOCKER_REGISTRY
  script:
    - docker build -t $DOCKER_REGISTRY/$API_IMAGE:$CI_COMMIT_SHA -t $DOCKER_REGISTRY/$API_IMAGE:latest ./server
    - docker push $DOCKER_REGISTRY/$API_IMAGE:$CI_COMMIT_SHA
    - docker push $DOCKER_REGISTRY/$API_IMAGE:latest
  only:
    - main

deploy:
  stage: deploy
  image: curlimages/curl:latest
  dependencies:
    - build-web
    - build-api
  script:
    -  curl --location --request POST "$PORTAINER_URL"
  only:
    - main