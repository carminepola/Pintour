stages:
  - build
  - deploy

variables:
  DOCKER_REGISTRY: ${DOCKER_REGISTRY}
  DOCKER_REGISTRY_USER: ${DOCKER_REGISTRY_USER}
  DOCKER_REGISTRY_PASSWORD: ${DOCKER_REGISTRY_PASSWORD}
  WEB_IMAGE: ${WEB_IMAGE:-pintourbus-web}
  API_IMAGE: ${API_IMAGE:-pintourbus-api}
  PORTAINER_URL: ${PORTAINER_URL}
  PORTAINER_TOKEN: ${PORTAINER_TOKEN}
  PORTAINER_STACK_ID: ${PORTAINER_STACK_ID}

build-web:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  before_script:
    - echo $DOCKER_REGISTRY_PASSWORD | docker login -u $DOCKER_REGISTRY_USER --password-stdin $DOCKER_REGISTRY
  script:
    - docker build -t $WEB_IMAGE:$CI_COMMIT_SHA -t $WEB_IMAGE:latest .
    - docker push $WEB_IMAGE:$CI_COMMIT_SHA
    - docker push $WEB_IMAGE:latest
  only:
    - main

build-api:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  before_script:
    - echo $DOCKER_REGISTRY_PASSWORD | docker login -u $DOCKER_REGISTRY_USER --password-stdin $DOCKER_REGISTRY
  script:
    - docker build -t $API_IMAGE:$CI_COMMIT_SHA -t $API_IMAGE:latest ./server
    - docker push $API_IMAGE:$CI_COMMIT_SHA
    - docker push $API_IMAGE:latest
  only:
    - main

deploy:
  stage: deploy
  image: curlimages/curl:latest
  dependencies:
    - build-web
    - build-api
  script:
    -  curl --location --request POST "$PORTAINER_URL"
  only:
    - main